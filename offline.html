<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#c0376a">
  <title>One Ball at a Time — Offline</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #3f2933; font-family: system-ui, sans-serif; background-color: #fffafc; background-image: linear-gradient(rgba(223,79,134,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(223,79,134,.12) 1px, transparent 1px); background-size: 28px 28px; }
    main { width: min(480px, 100%); padding: 34px; border: 2px solid #cf7193; border-radius: 8px; background: #fffdfd; box-shadow: 8px 9px 0 rgba(184,77,118,.18); text-align: center; }
    h1 { margin: 0 0 12px; color: #c0376a; font-family: Georgia, serif; }
    p { color: #7b5665; line-height: 1.6; }
    a { display: inline-block; margin-top: 10px; padding: 11px 18px; border: 0; border-radius: 999px; color: white; background: #c0376a; font-weight: 700; text-decoration: none; box-shadow: 3px 4px 0 #a72f5b; }
  </style>
</head>
<body>
  <main>
    <div aria-hidden="true">🎀</div>
    <h1>Your board needs the internet</h1>
    <p>The private app stays safely online-only so login and task data never come from a stale cache. Reconnect, then try again.</p>
    <a href="">Try again</a>
  </main>
</body>
</html>
